name: Repository Backup

on:
  schedule:
    - cron: "0 2 * * *"       # Runs daily at 02:00 UTC
  push:
    branches: [main]
  workflow_dispatch:            # Allows manual trigger from GitHub UI

jobs:
  backup-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker image
        run: docker compose -f docker/docker-compose.yml build --no-cache
      - name: Run backup
        env:
          REPO_URL: ${{https://github.com/Anveshith/cicd-repo-backup-system}}
          BACKUP_DIR: /backups
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          docker compose -f docker/docker-compose.yml run \
            -e REPO_URL -e BACKUP_DIR -e GPG_PASSPHRASE \
            backup-runner

      - name: Run tests
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          BACKUP_DIR: /backups
        run: |
          docker compose -f docker/docker-compose.yml run \
            -e GPG_PASSPHRASE -e BACKUP_DIR \
            test-runner

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: backup-${{ github.run_id }}
          path: backups/
          retention-days: 30

      - name: Report success
        if: success()
        run: echo "✅ Backup and tests passed on $(date)"

      - name: Report failure
        if: failure()
        run: echo "❌ Backup pipeline failed — check logs above"