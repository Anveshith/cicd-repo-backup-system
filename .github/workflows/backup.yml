name: Repository Backup

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backup-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --no-cache -t backup-image -f docker/Dockerfile .

      - name: Run backup
        run: |
          docker run --rm \
            -e REPO_URL=${{ secrets.REPO_URL }} \
            -e BACKUP_DIR=/backups \
            -e GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }} \
            -v ${{ github.workspace }}/backups:/backups \
            backup-image

      - name: Run tests
        run: |
          docker run --rm \
            --entrypoint bash \
            -e GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }} \
            -e BACKUP_DIR=/backups \
            -v ${{ github.workspace }}/backups:/backups \
            backup-image -c "pytest /app/tests/ -v --tb=short"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backups/
          retention-days: 30

      - name: Report result
        if: success()
        run: echo "✅ Backup and tests passed on $(date)"